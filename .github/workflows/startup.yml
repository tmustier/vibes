name: startup

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # agent-default (not a user rule): 2026-10-13

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    # The locked dependency tree includes a macOS-only Computer Use package.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: python3 tests/ci.py portable

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm install -g npm@latest
      - run: npm install -g --before "$(node -p 'require("./package.json").piDependencyCutoff')" "@earendil-works/pi-coding-agent@$(node -p 'require("./package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
      # Verify the production-only install before adding development dependencies.
      - run: npm ci --omit=dev
      - run: python3 tests/startup_check.py
      - run: python3 tests/test_feature_startup.py
      - run: npm ci
      - run: brew install tmux bat git-delta glow uv
      - run: python3 tests/ci.py macos

  startup:
    if: always()
    needs: [portable, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require both check suites
        env:
          PORTABLE: ${{ needs.portable.result }}
          MACOS: ${{ needs.macos.result }}
        run: test "$PORTABLE" = success && test "$MACOS" = success
